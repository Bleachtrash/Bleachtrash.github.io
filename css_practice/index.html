<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 id="title">The Seasons</h1>
    </header>

    <main>
        <div class="row">
            <figure id="spring" class="season_card">
                <img id="img_spring" class="season_img" src="imgs/spring.png" />
                <figcaption class="label">Spring</figcaption>
            </figure>
            <figure id="summer" class="season_card">
                <img id="img_summer" class="season_img" src="imgs/summer.png" />
                <figcaption class="label">Summer</figcaption>
            </figure>
        </div>
        <div class="row">
            <figure id="autumn" class="season_card">
                <img id="img_autumn" class="season_img" src="imgs/fall.png" />
                <figcaption class="label">Autumn</figcaption>
            </figure>
            <figure id="winter" class="season_card">
                <img id="img_winter" class="season_img" src="imgs/winter.png" />
                <figcaption class="label">Winter</figcaption>
            </figure>
        </div>
    </main>
    <hr />
    <footer>
        California State University Monterey Bay
        <img id="logo" src="imgs/csumb_logo.png" />
    </footer>
</body>

</html>
