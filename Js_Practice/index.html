<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap" rel="stylesheet">

</head>

<body>
    <img id="background" src="imgs/background.jpg" />
    <header>
        <h1>Guess a Number Between 1 and 99!</h1>
    </header>
    <main>
        <div id="input">
            <input id="number_input" type="number" min="1" max="99">
            <button id="guess_button">Guess!</button>
        </div>
        <div id="information">
            <p id="guess_message">Make a guess</p>
            <p id="tries_left">Tries Left: 7</p>
            <p id="guesses">Guesses: </p>
        </div>
        <script src="scripts/script.js"></script>
    </main>
</body>

</html>
