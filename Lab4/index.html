<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Sign Up Form </h1>

    <fieldset>
        <legend>Sign Up</legend>
        First Name: <input id="first_name_input" type="text"><br>
        Last Name: <input id="last_name_input" type="text"><br>
        Email: <input id="email_input" type="text"><br>
        Phone Number:<input id="phone_number_input" type="text"><br><br>
        Zip Code: <input id="zip_code_input" type="text"><br>
        <p id="city_p">City:</p>
        <p id="lat_p">Latitude:</p>
        <p id="lon_p">Longitude:</p>
        State: <select id="state_select"></select><br>
        Select a County: <select id="county_select"></select><br>

        Desired Username: <input id="username_input" type="text"><br>
        <p id="username_availability"></p>
        Password: <input id="password_input" type="password"><br>
        Type Password Again: <input id="password_again_input" type="password"><br>
        <p id="password_good"></p>
        <input id="submit_button" type="submit" value="Sign up!">
    </fieldset>
</body>

<script src="scripts/script.js"></script>

</html>
